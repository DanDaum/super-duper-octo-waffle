<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firebase Hosting Test</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 40px; line-height: 1.4; }
      .card { max-width: 720px; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
      code { padding: 2px 6px; border-radius: 6px; background: #f5f5f5; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; background: white; cursor: pointer; }
      button:active { transform: translateY(1px); }
      .muted { color: #666; }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Firebase Hosting is live ✅</h1>
      <p class="muted">
        If you can see this page, your deploy worked.
      </p>

      <p>
        Timestamp: <code id="ts"></code>
      </p>

      <button id="btn">Click to test JavaScript</button>
      <p id="out" class="muted"></p>

      <hr />

      <p class="muted">
        Edit this file, commit, and redeploy to verify updates.
      </p>
    </div>

    <script>
      document.getElementById("ts").textContent = new Date().toLocaleString();

      document.getElementById("btn").addEventListener("click", () => {
        document.getElementById("out").textContent = "JS works. Clicked at " + new Date().toLocaleTimeString();
      });
    </script>
  </body>
</html>
